<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK (compat for non-module usage) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
    <!-- Login screen (shown when Firebase is configured) -->
    <div id="login-screen" class="login-screen" style="display:none;">
        <div class="login-card">
            <h1>Family Planner</h1>
            <p>Sign in to access your household.</p>
            <button id="google-sign-in" class="google-btn">Sign in with Google</button>
        </div>
    </div>

    <div id="app-wrapper">
        <header>
            <h1>Family Planner</h1>
            <!-- Top-level module nav (rendered by shell.js from modules.js) -->
            <nav id="top-nav"></nav>
            <button id="sign-out-btn" class="sign-out-btn" style="display:none;" title="Sign out">Sign Out</button>
        </header>

        <!-- Active module's DOM is mounted here -->
        <main id="module-host"></main>
    </div><!-- /app-wrapper -->

    <div id="toast" class="toast"></div>

    <!-- ES modules: shell.js is the single entry; it imports the rest. -->
    <script type="module" src="js/shell.js"></script>
</body>
</html>
