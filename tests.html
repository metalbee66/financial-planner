<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Planner — Tests</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .test-page { max-width: 900px; margin: 24px auto; padding: 16px; }
        .test-summary { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-weight: 500; }
        .test-summary.ok { background: rgba(0,200,83,0.12); color: var(--green); border: 1px solid var(--green); }
        .test-summary.fail { background: rgba(255,82,82,0.12); color: var(--red); border: 1px solid var(--red); }
        .test-row { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; font-size: 0.88rem; }
        .test-row .badge { font-family: var(--mono); font-weight: 600; flex-shrink: 0; width: 56px; }
        .test-row.ok .badge { color: var(--green); }
        .test-row.fail .badge { color: var(--red); }
        .test-row .err { color: var(--red); display: block; margin-top: 4px; font-family: var(--mono); font-size: 0.8rem; white-space: pre-wrap; }
        .test-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
        .test-section h2 { color: var(--accent); font-size: 1rem; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="test-page">
        <h1 style="color:var(--accent);margin-bottom:16px;">Family Planner — Test Runner</h1>
        <p style="color:var(--text-dim);margin-bottom:20px;font-size:0.85rem;">
            In-browser tests for pure data-layer functions. Run with <code>python server.py</code> then visit <code>/tests.html</code>.
        </p>
        <div id="test-output"></div>
    </div>

    <script type="module">
        import { runProjectsDataTests } from './js/modules/projects/data.test.js';
        import { runDataTests } from './js/data.test.js';

        const sections = [
            { title: 'Projects — data layer', run: runProjectsDataTests },
            { title: 'Family Planner — bank inbox + HSBC parser', run: runDataTests },
        ];

        const out = document.getElementById('test-output');
        let totalPass = 0, totalFail = 0;

        for (const sec of sections) {
            const wrap = document.createElement('div');
            wrap.className = 'test-section';
            wrap.innerHTML = `<h2>${sec.title}</h2><div class="rows"></div>`;
            out.appendChild(wrap);
            const rows = wrap.querySelector('.rows');

            const { pass, fail, results } = await sec.run();
            totalPass += pass;
            totalFail += fail;

            for (const r of results) {
                const row = document.createElement('div');
                row.className = 'test-row ' + (r.ok ? 'ok' : 'fail');
                row.innerHTML = `<span class="badge">${r.ok ? 'PASS' : 'FAIL'}</span><span>${r.name}${r.error ? `<span class="err">${escapeHtml(r.error)}</span>` : ''}</span>`;
                rows.appendChild(row);
            }
        }

        const summary = document.createElement('div');
        summary.className = 'test-summary ' + (totalFail === 0 ? 'ok' : 'fail');
        summary.textContent = `${totalPass} passed, ${totalFail} failed`;
        out.insertBefore(summary, out.firstChild);

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
    </script>
</body>
</html>
